<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>AI 무료음악 자동화 엔진</title>
<style>
  :root { color-scheme: dark; --bg: #070b14; --card: #0d1424; --line: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --teal: #2dd4bf; --green: #10b981; --amber: #fbbf24; --rose: #fb7185; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.55 "Malgun Gothic", "Segoe UI", sans-serif; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 15px; margin: 0; }
  .ver { font-size: 11px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .badge { border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 12px; border: 1px solid; }
  .ok { color: var(--green); border-color: #10b98166; } .wait { color: var(--amber); border-color: #fbbf2466; } .off { color: var(--rose); border-color: #fb718566; }
  .stage { color: var(--muted); font-size: 12px; margin-top: 6px; word-break: keep-all; }
  .code { font: 700 30px/1 "Consolas", monospace; letter-spacing: 8px; color: var(--teal); text-align: center; padding: 10px 0 4px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { background: #111a2e; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { border-color: var(--teal); }
  button.main { background: linear-gradient(90deg, #0d9488, #059669); border: 0; color: #fff; grid-column: span 2; }
  label { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .note { color: var(--amber); font-size: 12px; margin-top: 8px; }
  .update { border-color: #2dd4bf66; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { max-height: 180px; overflow: auto; font: 11px/1.45 "Consolas", monospace; color: #cbd5e1; white-space: pre-wrap; margin: 8px 0 0; }
</style>
</head>
<body>
  <header>
    <img src="build/icon.png" alt="" onerror="this.style.display='none'" />
    <div><h1>🎵 AI 무료음악 자동화 엔진</h1><div class="ver" id="ver"></div></div>
  </header>

  <div class="card update" id="update" hidden>
    <div class="row"><b>✨ 새 버전 <span id="newVer"></span>이 있습니다</b><button id="dl">받기</button></div>
    <div class="stage">받은 설치 파일을 실행하면 덮어 설치됩니다. 받아 둔 모델·노래·연결은 그대로 남습니다.</div>
  </div>

  <div class="card">
    <div class="row"><b>엔진 상태</b><span class="badge wait" id="badge">켜는 중</span></div>
    <div class="stage" id="stage">엔진을 켜고 있습니다…</div>
    <div class="note" id="msg" hidden></div>
  </div>

  <div class="card" id="pairCard">
    <b>🔑 연결 코드</b>
    <div class="code" id="code">······</div>
    <div class="hint">사이트 「내 PC 엔진」 화면에 이 6자리를 넣고 [PC 연결]을 누르세요.<br />한 번 연결하면 다음부터는 넣지 않아도 됩니다.</div>
  </div>

  <div class="card btns">
    <button class="main" data-a="engine-page">🌐 사이트에서 노래 만들기</button>
    <button data-a="library">📁 노래 저장 폴더</button>
    <button data-a="logs">📝 기록 보기</button>
    <button data-a="restart">🔄 엔진 다시 켜기</button>
    <button data-a="quit">⏻ 끄기</button>
  </div>

  <div class="card">
    <label><input type="checkbox" id="auto" /> PC 켤 때 자동 실행</label>
    <div class="stage" id="trayNote">창의 X는 숨기기만 합니다. 엔진은 작업 표시줄 오른쪽 아래 🎵 아이콘에서 계속 돌아갑니다. 완전히 끄려면 [끄기]를 누르세요.</div>
  </div>

  <div class="card">
    <details><summary>엔진 기록(최근 줄)</summary><pre id="log"></pre></details>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  document.querySelectorAll("button[data-a]").forEach((b) => b.addEventListener("click", () => window.engine.action(b.dataset.a)));
  $("dl").addEventListener("click", () => window.engine.action("download"));
  $("auto").addEventListener("change", (e) => window.engine.action("autostart", e.target.checked));
  window.engine.onState((s) => {
    $("ver").textContent = `엔진 ${s.version}`;
    const st = s.status;
    const text = !s.running ? "꺼짐" : !st ? "켜는 중" : st.ready ? "준비됨" : st.stage === "미지원" ? "미지원" : "준비 중";
    $("badge").textContent = text;
    $("badge").className = "badge " + (text === "준비됨" ? "ok" : ["꺼짐", "미지원"].includes(text) ? "off" : "wait");
    $("stage").textContent = st ? `${st.stage || ""}${st.error ? " — " + st.error : ""}${st.mode ? " · " + st.mode : ""}` : s.running ? "엔진을 켜고 있습니다…" : "엔진이 꺼져 있습니다. [엔진 다시 켜기]를 눌러 주세요.";
    $("msg").hidden = !s.message;
    $("msg").textContent = s.message || "";
    $("code").textContent = s.pairCode || "······";
    $("pairCard").hidden = !!(st && st.paired && !s.pairCode);
    $("auto").checked = !!s.autoStart;
    if (s.platform === "darwin") $("trayNote").textContent = "창의 X는 숨기기만 합니다. 엔진은 화면 위 메뉴 막대의 🎵 아이콘에서 계속 돌아갑니다. 완전히 끄려면 [끄기]를 누르세요.";
    $("update").hidden = !s.latest;
    if (s.latest) $("newVer").textContent = s.latest.version;
    const log = $("log");
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent = s.lines.slice(-80).join("\n");
    if (atBottom) log.scrollTop = log.scrollHeight;
  });
</script>
</body>
</html>
