<!DOCTYPE html>

<style>
  body { font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif; background: #0d1117; padding: 40px; margin: 0; color: white; }
  .wrapper { display: flex; gap: 30px; align-items: flex-start; }
  .sidebar { width: 288px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }
  .brand { border-bottom: 1px solid #30363d; padding: 20px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
  .icon { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: linear-gradient(135deg, #f59e0b, #b45309); color: #020617; font-size: 18px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2); }
  .text-col { display: flex; flex-direction: column; min-width: 0; }
  .title-old { font-size: 14px; font-weight: 800; color: white; line-height: 1.3; }
  .title-new { font-size: 14px; font-weight: 800; color: white; line-height: 1.3; white-space: nowrap; }
  .subtitle { font-size: 11px; font-weight: 500; color: #fbbf24; margin-top: 2px; }
  .badge-old { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; border: 1px solid rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); padding: 2px 10px; font-size: 10px; font-weight: bold; color: #fcd34d; flex-shrink: 0; }
  .badge-new { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; border: 1px solid rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); padding: 2px 8px; font-family: monospace; font-size: 10px; font-weight: bold; color: #fcd34d; flex-shrink: 0; }
  .desc { margin-top: 8px; font-size: 11px; color: #9ca3af; }
  .tag { font-size: 12px; font-weight: bold; margin-bottom: 8px; }
  .tag.bad { color: #f87171; }
  .tag.good { color: #34d399; }
</style>
</head>
