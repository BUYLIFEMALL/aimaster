<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>본인 글 1개 읽기</title><link rel="stylesheet" href="popup.css">
<body><header><small>AIMaster · 본인 글 읽기 · v1.01</small><h1>내 글을 프로그램으로</h1><p id="connection" role="status">연결 확인 중…</p></header>
<main><a class="button" href="https://blog-neighbor-care.buylife.xyz/reader" target="_blank" rel="noreferrer">프로그램 · 설치 안내 열기</a>
<details><summary>연결 번호로 연결</summary><label>프로그램에서 받은 번호<input id="code" maxlength="32" autocomplete="off" spellcheck="false"></label><button id="connect">이 회원 계정과 연결</button></details>
<label class="check"><input id="confirm" type="checkbox">연결한 본인 블로그의 글이며, 이 본문을 프로그램에 전달해도 됩니다.</label>
<button id="read" class="primary">현재 글 1개 읽기</button><p>먼저 네이버에서 글 1개를 열어 주세요. 제목·본문 텍스트만 읽습니다. 이미지는 전달하지 않습니다.</p>
<section id="preview" hidden><h2 id="title"></h2><pre id="body"></pre><p id="size"></p><button id="submit" class="primary">확인한 내용을 프로그램으로 보내기</button></section>
<button id="receipt">이전 전송 결과 확인</button><button id="disconnect" class="quiet">이 기기 연결 해제</button>
<p id="message" role="status" aria-live="polite"></p></main><script type="module" src="popup.mjs"></script></body></html>
