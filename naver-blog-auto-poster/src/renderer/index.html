<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AIMaster 네이버 블로그 자동화 — 프로토타입 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>네이버 로그인 세션 확인</h1>
    <p class="desc">
      아이디/비밀번호는 자동으로 입력되지 않습니다. 버튼을 누르면 브라우저 창이 열리고,
      로그인되어 있지 않으면 그 창에서 직접 로그인/보안확인을 완료해주세요.
      한 번 로그인하면 다음부터는 이 앱을 다시 열어도 로그인 상태가 유지됩니다.
    </p>
    <button id="check-btn">네이버 세션 확인</button>
    <div id="status" class="status">대기 중</div>

    <h1 class="section-title">에디터 구조 조사 (프로토타입 2)</h1>
    <p class="desc">
      위에서 연 브라우저 창에서 직접 블로그 글쓰기 화면(내 블로그 → 글쓰기)으로 이동한
      뒤, 아래 버튼을 눌러주세요. 현재 화면 구조를 분석해서 로컬 파일로 저장합니다.
    </p>
    <button id="inspect-btn">에디터 구조 분석</button>
    <div id="inspect-status" class="status">대기 중</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
