<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AIMaster 네이버 블로그 자동화</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>AIMaster 계정 연동</h1>
    <p class="desc">
      <a href="https://www.buylife.xyz/naver-blog-auto-poster" target="_blank" rel="noopener">buylife.xyz</a>에
      로그인한 뒤 그 화면에서 발급한 토큰을 아래에 붙여넣으세요. 데스크톱 앱과 같은
      토큰을 그대로 써도 됩니다.
    </p>
    <input id="aimaster-token" type="password" placeholder="발급받은 토큰 붙여넣기 (pat_...)" />
    <button id="aimaster-link-btn">연동하기</button>
    <div id="aimaster-status" class="status">확인 중...</div>

    <h1 class="section-title">1단계: 제목/본문 자동 입력 (프로토타입 2)</h1>
    <p class="desc">
      다른 탭에서 네이버 블로그 글쓰기 화면을 열어둔 상태에서 눌러주세요. 이 화면이
      보고 있는 탭(가장 최근에 활성화한 탭)에 자동으로 채워 넣습니다.
    </p>
    <input id="draft-title" type="text" placeholder="테스트 제목" />
    <textarea id="draft-body" rows="6" placeholder="테스트 본문 (여러 줄 가능)"></textarea>
    <button id="draft-btn">1단계 시작</button>
    <div id="draft-status" class="status">대기 중</div>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
