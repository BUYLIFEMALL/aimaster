<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>카페 초대</title>
<style>body{font:14px/1.5 system-ui,sans-serif;width:300px;margin:12px;color:#1f2937}button{width:100%;min-height:44px;margin-top:8px;border:0;border-radius:8px;font-weight:700;cursor:pointer}#start{background:#03c75a;color:#fff}#collect{background:#e0f2fe;color:#075985}#stop{background:#fee2e2;color:#b91c1c}small{color:#6b7280}hr{border:0;border-top:1px solid #e5e7eb;margin:12px 0}</style></head>
<body><b>☕ 네이버 카페 회원 모집 자동화</b> <small>v1.02</small>
<p id="status">확인 중…</p>
<button id="start">이 카페로 초대 시작</button>
<p><small>프로그램에서 승인한 사람에게만, 초대 메뉴가 보이는 내 카페를 연 채 누르세요. 1~2분에 한 명씩, 하루 상한 안에서만 보냅니다.</small></p>
<hr>
<p id="collectStatus"></p>
<button id="collect">이 게시판 작성자 명단 모으기</button>
<p><small>가입한 카페의 게시판 글 목록 화면에서 누르세요. 글쓴이 닉네임·등급만 읽고(아이디 없음), 30~45초마다 다음 페이지로 최대 10페이지까지 읽습니다. 설정에서 「A. 카페 활동 회원 명단」을 켜야 합니다.</small></p>
<button id="stop">멈추기</button>
<p><small>카페 탭을 앞에 둔 채 두세요(다른 탭을 보면 잠시 멈춥니다). 로그인·보안 확인·제한 안내가 뜨면 멈춥니다.</small></p>
<script src="popup.js"></script></body></html>
