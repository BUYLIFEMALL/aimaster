<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Naver Blog SEO Studio</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <header><span class="eyebrow">AIMaster</span><h1>Naver Blog<br>SEO Studio</h1><p>검색 의도를 읽고, 내 이야기로 작성해보세요.</p></header>
    <section class="card">
      <h2>계정 연동</h2>
      <p class="hint"><a href="https://naver-blog-seo-studio.vercel.app/settings" target="_blank">SEO Studio 설정</a>에서 발급한 토큰을 입력하세요.</p>
      <input id="token" type="password" placeholder="pat_... 토큰 붙여넣기">
      <button id="link">SEO Studio 연결</button><div id="status" class="status">연결되지 않음</div>
    </section>
    <section class="card">
      <h2>AI 초안 작성</h2>
      <input id="topic" placeholder="작성할 주제">
      <input id="keywords" placeholder="핵심 키워드 (쉼표로 구분)">
      <button id="generate">초안 생성</button><div id="generateStatus" class="status"></div>
      <input id="title" placeholder="생성된 제목">
      <textarea id="body" rows="12" placeholder="생성된 본문"></textarea>
      <button id="fill" class="secondary">네이버 편집기에 입력</button>
    </section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
