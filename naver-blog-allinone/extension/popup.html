<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>네이버 블로그 올인원 마스터 PRO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #0f172a;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .draft-title {
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .draft-meta {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .empty-state {
      text-align: center;
      padding: 16px 0;
      color: #94a3b8;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
      border: none;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
    }
    .btn-secondary {
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo-dot"></span>
      <span class="title">올인원 마스터 PRO</span>
      <span class="badge">v1.04</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">대기 중인 최신 원고</div>
    <div id="draft-container">
      <div id="draft-title" class="draft-title">불러오는 중...</div>
      <div class="draft-meta">
        <span id="draft-time">-</span>
        <span id="draft-status" style="color: #10b981; font-weight: 600;">준비 완료</span>
      </div>
    </div>
  </div>

  <button id="open-naver-btn" class="btn btn-primary">
    <span>⚡ 네이버 글쓰기 열기 (자동 주입)</span>
  </button>

  <button id="open-web-btn" class="btn btn-secondary">
    <span>🌐 올인원 마스터 웹페이지 열기</span>
  </button>

  <div class="footer">
    네이버 스마트에디터 ONE 자동 연동 확장
  </div>

  <script src="popup.js"></script>
</body>
</html>
