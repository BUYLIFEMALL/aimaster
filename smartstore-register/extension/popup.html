<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; font: 13px -apple-system, "Malgun Gothic", sans-serif; color: #0f172a; background: #f5f7fa; }
  .wrap { padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; margin-bottom: 8px; line-height: 1.5; }
  .ok { color: #047857; font-weight: 700; } .warn { color: #b45309; font-weight: 700; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 8px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; color: #0f172a; }
  .primary { background: #047857; border-color: #047857; color: #fff !important; }
  small { color: #64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 스마트스토어 상품등록 자동화</h1>
  <div class="card"><div id="conn">확인 중…</div><small id="ver"></small></div>
  <div class="card"><b>지금 상태</b><div id="status">—</div></div>
  <a class="btn primary" id="open" href="https://smartstore-register.buylife.xyz/extension" target="_blank">프로그램 열기 · 연결</a>
  <button id="run">지금 작업 확인</button>
  <button id="disconnect">연결 끊기</button>
</div>
<script src="popup.js"></script>
</body>
</html>
