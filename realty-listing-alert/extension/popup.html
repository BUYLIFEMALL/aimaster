<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{font:13px sans-serif;width:330px;padding:10px}button{width:100%;margin:4px 0;padding:8px;cursor:pointer}
#log{white-space:pre-wrap;background:#f4f4f4;padding:6px;max-height:220px;overflow:auto;font-size:11px}
input{width:100%;box-sizing:border-box;margin:2px 0}small{color:#666}
</style></head><body>
<b>부동산 사전 검증 (임시)</b><br><small>네이버 부동산 단지 화면(매물 목록이 보이는 상태)을 연 탭에서 누르세요.</small>
<button id="capture">① 응답 읽기 시험 (자동 스크롤 최대 3페이지 + 60초 기록)</button>
<button id="direct">② 같은 주소 직접 부르기 시험 (1·2페이지)</button>
<button id="alarm">③ 예약 타이머 시험 시작 (5분, 시작 후 창 최소화)</button>
<details><summary>④ 텔레그램 파일 보내기 시험(선택)</summary>
<input id="tok" placeholder="시험용 봇 토큰"><input id="chat" placeholder="chat id">
<button id="tg">시험 파일 1개 보내기</button></details>
<button id="save">결과 파일 저장 (다운로드 폴더)</button>
<div id="log"></div>
<script src="popup.js"></script></body></html>
