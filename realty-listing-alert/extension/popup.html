<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 웹 프로그램과 같은 테마(스마트 매트릭스 라이트·네이버 그린, app/globals.css 토큰) — 2026-10-25 주인님 지시 「메인 자동화 프로그램 테마로」 -->
<style>
  :root { --ink:#0f172a; --muted:#5b6475; --line:#e2e6ee; --paper:#f6f7f9; --panel:#fff; --accent:#009b4d; --accent-bright:#03c75a; --accent-soft:#e8f8ef; --warn:#b45309; --warn-soft:#fff7e6; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 520px; background: var(--paper); color: var(--ink); font: 15px/1.55 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .hero { padding: 16px 18px 14px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-bright) 100%); color: #fff; }
  .hero-top { display: flex; align-items: center; gap: 10px; }
  .logo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.22); font-size: 22px; }
  .hero h1 { margin: 0; font-size: 19px; letter-spacing: -0.03em; }
  .chip { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.25); font-size: 13px; font-weight: 800; }
  .hero p { margin: 8px 0 0; font-size: 14px; opacity: .95; }
  main { padding: 14px 16px 16px; display: grid; gap: 12px; }
  .status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .stat small { display: block; color: var(--muted); font-size: 13px; }
  .stat b { display: block; margin-top: 3px; font-size: 16px; }
  .stat.ok { border-color: #bfe6cf; background: var(--accent-soft); }
  .stat.ok b { color: var(--accent); }
  .stat.no { border-color: #f3d9a8; background: var(--warn-soft); }
  .stat.no b { color: var(--warn); }
  .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .link { padding: 10px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .link:hover { border-color: var(--accent); color: var(--accent); }
  .section-title { margin: 4px 0 0; font-size: 15px; font-weight: 800; }
  .section-title small { color: var(--muted); font-weight: 500; font-size: 13px; }
  .tools { display: grid; gap: 8px; }
  .tool { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .tool:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,155,77,.12); }
  .tool .ico { display: grid; place-items: center; flex: 0 0 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); font-size: 19px; }
  .tool b { display: block; font-size: 15px; }
  .tool small { color: var(--muted); font-size: 13px; }
  .tool.primary { border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-bright)); color: #fff; }
  .tool.primary .ico { background: rgba(255,255,255,.22); }
  .tool.primary small { color: rgba(255,255,255,.9); }
  details { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 700; }
  details input { width: 100%; margin-top: 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; }
  details .tool { margin-top: 8px; }
  .log-box { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
  .log-box h2 { margin: 0; padding: 9px 14px; border-bottom: 1px solid var(--line); background: #fbfcfd; font-size: 14px; }
  #log { margin: 0; padding: 10px 14px; max-height: 220px; overflow: auto; white-space: pre-wrap; font: 13px/1.65 ui-monospace, "Cascadia Mono", Consolas, monospace; color: #334155; }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <span class="logo">🏡</span>
      <h1>부동산 매물 알림</h1>
      <span class="chip" id="ver"></span>
    </div>
    <p>📍 내 PC에서 관심 단지 새 매물을 찾아 📨 텔레그램으로 알려 드려요.</p>
  </header>

  <main>
    <div class="status">
      <div class="stat" id="connBox"><small>🔗 웹 연결</small><b id="conn">확인 중…</b></div>
      <div class="stat"><small>🖥 이 PC</small><b>확장 켜짐 ✅</b></div>
    </div>

    <div class="links">
      <button class="link" data-path="/targets">🎯 감시 대상</button>
      <button class="link" data-path="/schedule">⏰ 예약 설정</button>
      <button class="link" data-path="/delivery">📨 받는 방법</button>
    </div>

    <p class="section-title">🧪 수집 시험 도구 <small>· 매물 목록이 보이는 단지 탭에서 눌러 주세요</small></p>
    <div class="tools">
      <button class="tool primary" id="capture"><span class="ico">📡</span><span><b>응답 읽기</b><small>3페이지 · 약 1분</small></span></button>
      <button class="tool" id="direct"><span class="ico">🔍</span><span><b>직접 부르기</b><small>1·2페이지 · 약 20초</small></span></button>
      <button class="tool" id="alarm"><span class="ico">⏰</span><span><b>예약 타이머</b><small>창을 최소화하고 5분</small></span></button>
      <details>
        <summary>📨 텔레그램 파일 보내기 (선택)</summary>
        <input id="tok" placeholder="시험용 봇 토큰">
        <input id="chat" placeholder="chat id">
        <button class="tool" id="tg"><span class="ico">📎</span><span><b>시험 파일 1개 보내기</b></span></button>
      </details>
      <button class="tool" id="save"><span class="ico">📄</span><span><b>결과 보기 · 파일로 받기</b></span></button>
    </div>

    <section class="log-box">
      <h2>📝 진행 상황 · 최근 기록</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
