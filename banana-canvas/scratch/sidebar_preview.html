<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사이드바 전체 맥락 바나나 로고 대조</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafaf9; padding: 40px; margin: 0; color: #1c1917; }
  .grid { display: flex; gap: 30px; align-items: flex-start; }
  .sidebar { width: 256px; background: linear-gradient(180deg, #ffffff 0%, #fefcf5 100%); border: 1px solid #f1e4b8; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
  .sidebar-brand { border-bottom: 1px solid #f1e4b8; padding: 20px 18px; }
  .brand-row { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .name { font-size: 14px; font-weight: 900; color: #1c1917; line-height: 1.3; }
  .badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 900; background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%); color: #78350f; border: 1px solid #fcd34d; margin-top: 4px; }
  .backlink { display: block; margin-top: 12px; font-size: 11px; color: #78350f; text-decoration: none; }

  /* 기존 로고 */
  .icon-old {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(135deg, #fef08a 0%, #fcd34d 40%, #f59e0b 100%);
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.6);
    border: 1px solid #fde047;
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
  }

  /* 추천 A: 딥 웜 차콜 엠블럼 */
  .icon-new-a {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(145deg, #262220 0%, #151312 100%);
    box-shadow: 0 4px 14px rgba(21, 19, 18, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    border: 1.5px solid #d97706;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .tag { font-size: 12px; font-weight: 800; margin-bottom: 8px; }
</style>
</head>
<body>
  <h2>AI 바나나 캔버스 사이드바 실제 배치 대조 검증</h2>
  <div class="grid">
    <!-- 기존 -->
    <div>
      <div class="tag" style="color: #dc2626;">❌ 현재 (노란 배경에 묻혀 바나나가 안 보임)</div>
      <div class="sidebar">
        <div class="sidebar-brand">
          <a class="brand-row" href="#">
            <div class="icon-old">🍌</div>
            <div style="min-width: 0; flex: 1;">
              <strong class="name" style="display: block;">AI 바나나 캔버스 자동화</strong>
              <div><span class="badge">v1.42 PRO</span></div>
            </div>
          </a>
          <a class="backlink" href="#">← 다른 프로그램 보기</a>
        </div>
      </div>
    </div>

    <!-- 추천 A -->
    <div>
      <div class="tag" style="color: #059669;">★ [개선 반영] 딥 웜 차콜 엠블럼 + 3D 골든 바나나 SVG</div>
      <div class="sidebar">
        <div class="sidebar-brand">
          <a class="brand-row" href="#">
            <div class="icon-new-a">
              <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
                <path d="M26 6.5C28.5 4.5 30 4 30.8 4.8C31.5 5.5 31 7 28.5 9.5L26 6.5Z" fill="#16a34a" stroke="#14532d" stroke-width="1.2"/>
                <path d="M5.5 25.5C8 28.5 15 30 22 25.5C27 22 30 16 28 8C25.5 9 20 11.5 15 15C9.5 19 6.5 22.5 5.5 25.5Z" fill="url(#bg1)" stroke="#92400e" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M9 23.5C13 25.5 18 24.5 23 21C26.5 18 28 13.5 27 10C24.5 11 20 13 16 16C12 19 9.8 21.5 9 23.5Z" fill="#fef08a" opacity="0.95"/>
                <path d="M12 21C16 22 21 20 24.5 16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
                <path d="M5.5 25.5C4.8 26.5 4 27.5 4.5 28.2C5 28.8 6 28 7 27" stroke="#78350f" stroke-width="2.2" stroke-linecap="round"/>
                <defs>
                  <linearGradient id="bg1" x1="5" y1="8" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#fef08a"/>
                    <stop offset="45%" stop-color="#facc15"/>
                    <stop offset="100%" stop-color="#ea580c"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
            <div style="min-width: 0; flex: 1;">
              <strong class="name" style="display: block;">AI 바나나 캔버스 자동화</strong>
              <div><span class="badge">v1.42 PRO</span></div>
            </div>
          </a>
          <a class="backlink" href="#">← 다른 프로그램 보기</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
